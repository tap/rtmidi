name: C/C++ CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - api: jack
            APIcmake: JACK
            deps: libjack-dev
          - api: alsa
            APIcmake: ALSA
            deps: libasound-dev
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: install dependencies
      run:
        sudo apt-get update
        && sudo apt-get install g++ autoconf-archive cmake ${{matrix.deps}}
    - name: automake
      run:
        env NOCONFIGURE=1 ./autogen.sh && mkdir bld-automake && cd bld-automake
        && (../configure --with-${{matrix.api}} || (cat config.log; false))
        && make V=1 && make check
    - name: CMake
      run:
        mkdir bld-cmake && cd bld-cmake
        && cmake .. -DRTMIDI_API_JACK=OFF -DRTMIDI_API_ALSA=OFF -DRTMIDI_API_${{matrix.APIcmake}}=ON
        && make VERBOSE=1

  MacOS:
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: install dependencies
      run: brew install autoconf-archive automake cmake meson libtool
    - name: automake
      run:
        env NOCONFIGURE=1 ./autogen.sh && mkdir bld-automake && cd bld-automake
        && (../configure || (cat config.log; false))
        && make V=1 && make check
    - name: CMake
      run: mkdir bld-cmake && cd bld-cmake && cmake .. && make VERBOSE=1

  MinGW:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - host: i686-w64-mingw32
            api: winmm
          - host: x86_64-w64-mingw32
            api: winmm
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: install dependencies
      run:
        sudo apt-get update
        && sudo apt-get install g++-mingw-w64 autoconf-archive
    - name: automake
      run:
        env NOCONFIGURE=1 ./autogen.sh
        && mkdir bld-automake && cd bld-automake
        && (../configure --host=${{matrix.host}} --with-${{matrix.api}} CPPFLAGS=${{matrix.cppflags}} || (cat config.log; false))
        && make V=1

  Sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            sanitize: address,undefined
          - name: tsan
            sanitize: thread
    name: Sanitizers (${{matrix.name}})
    env:
      # Fail the build on any UBSan diagnostic instead of merely printing it.
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      ASAN_OPTIONS: detect_leaks=1
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: install dependencies
      run:
        sudo apt-get update
        && sudo apt-get install g++ autoconf-archive cmake libasound-dev
    - name: build and test (ALSA)
      run:
        env NOCONFIGURE=1 ./autogen.sh
        && mkdir bld-sanitize && cd bld-sanitize
        && (../configure --with-alsa
            CXXFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=${{matrix.sanitize}} -fno-sanitize-recover=all"
            LDFLAGS="-fsanitize=${{matrix.sanitize}}"
            || (cat config.log; false))
        && make V=1 && make check
